# Local PostgreSQL for development.
# Start it with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage   # local development only
    ports:
      - "5434:5432"               # 5434 on this Mac -> 5432 inside the container
    volumes:
      - triage-data:/var/lib/postgresql/data

volumes:
  triage-data:                    # named volume: data survives container restarts
