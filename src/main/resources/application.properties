spring.application.name=issue-triage-bot

# Load secrets such as GITHUB_TOKEN from a local .env file, if there is one.
# .env is listed in .gitignore, so it never reaches GitHub.
spring.config.import=optional:file:.env[.properties]

# Local PostgreSQL from compose.yaml (development only)
spring.datasource.url=jdbc:postgresql://localhost:5434/triage
spring.datasource.username=triage
spring.datasource.password=triage

# Run schema.sql at every startup to create the tables if they're missing
spring.sql.init.mode=always
